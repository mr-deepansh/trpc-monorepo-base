version: "3.9"

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: otel-collector
    restart: unless-stopped

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

    volumes:
      - ./otel-config.yaml:/etc/otelcol-contrib/config.yaml

    ports:
      - "4317:4317"
      - "4318:4318"